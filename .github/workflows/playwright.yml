name: CMT Sanity Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # Run D2C Sanity Tests
    - name: Run D2C Sanity Tests
      run: npx playwright test tests/D2C/ -g "@D2Csanity" --project=QA1_D2C --workers=1 --reporter=html,json

    # Prepare D2C Outputs
    - name: Prepare D2C Outputs
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path d2c-report
        Copy-Item "playwright-report/*" -Destination "d2c-report" -Recurse -Force
        Copy-Item "test-results.json" -Destination "d2c-report.json" -Force

    # Run MM Sanity Tests
    - name: Run MM Sanity Tests
      run: npx playwright test tests/MM/ -g "@MMsanity" --project=QA1_MM --workers=1 --reporter=html,json

    # Prepare MM Outputs
    - name: Prepare MM Outputs
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path mm-report
        Copy-Item "playwright-report/*" -Destination "mm-report" -Recurse -Force
        Copy-Item "test-results.json" -Destination "mm-report.json" -Force

    - name: Upload D2C Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: d2c-report
        path: |
          d2c-report/
          d2c-report.json

    - name: Upload MM Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mm-report
        path: |
          mm-report/
          mm-report.json

    - name: Deploy HTML Report to GitHub Pages
      if: always()
      shell: powershell
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"

        Write-Host "Preparing clean gh-pages folder..."

        New-Item -ItemType Directory -Force -Path deploy\d2c
        New-Item -ItemType Directory -Force -Path deploy\mm

        Copy-Item -Path "d2c-report\*" -Destination "deploy\d2c\" -Recurse -Force
        Copy-Item -Path "d2c-report.json" -Destination "deploy\d2c\" -Force

        Copy-Item -Path "mm-report\*" -Destination "deploy\mm\" -Recurse -Force
        Copy-Item -Path "mm-report.json" -Destination "deploy\mm\" -Force

        Set-Location deploy
        git init
        git checkout -b gh-pages
        git add .
        git commit -m "Deploy D2C & MM Reports"
        git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages --force

    - name: Send Webex Notification
      if: always()
      run: node sendWebex.js
      env:
        WEBEX_TOKEN: ${{ secrets.WEBEX_TOKEN }}
        WEBEX_ROOM_ID: ${{ secrets.WEBEX_ROOM_ID }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
