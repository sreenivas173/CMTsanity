name: CMT Sanity Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: self-hosted

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # Run D2C
    - name: Run D2C Sanity Tests
      shell: powershell
      run: |

        npx playwright test tests/D2C/ `
          -g "@D2Csanity" `
          --project=QA1_D2C `
          --workers=1 `
          --reporter=html,json

        if (Test-Path "playwright-report") {
          Rename-Item `
            playwright-report `
            d2c-report `
            -Force
        }

        if (Test-Path "test-results.json") {
          Copy-Item `
            test-results.json `
            d2c-report.json `
            -Force
        }

    # Run MM
    - name: Run MM Sanity Tests
      shell: powershell
      run: |

        npx playwright test tests/MM/ `
          -g "@MMsanity" `
          --project=QA1_MM `
          --workers=1 `
          --reporter=html,json

        if (Test-Path "playwright-report") {
          Rename-Item `
            playwright-report `
            mm-report `
            -Force
        }

        if (Test-Path "test-results.json") {
          Copy-Item `
            test-results.json `
            mm-report.json `
            -Force
        }

    # Debug
    - name: Debug generated files
      shell: powershell
      run: |

        Write-Host "Workspace"

        Get-ChildItem

        Write-Host "JSON"

        Get-ChildItem *.json

    # Upload artifacts
    - name: Upload D2C Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: d2c-report
        path: d2c-report/

    - name: Upload MM Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mm-report
        path: mm-report/

    # Deploy GitHub pages
    - name: Deploy HTML Report
      if: always()
      shell: powershell
      run: |

        git config --global user.name "github-actions"

        git config --global user.email `
          "github-actions@github.com"

        New-Item `
          -ItemType Directory `
          -Force `
          -Path deploy\d2c

        New-Item `
          -ItemType Directory `
          -Force `
          -Path deploy\mm

        if (Test-Path "d2c-report") {

          Copy-Item `
            "d2c-report\*" `
            "deploy\d2c\" `
            -Recurse `
            -Force
        }

        if (Test-Path "mm-report") {

          Copy-Item `
            "mm-report\*" `
            "deploy\mm\" `
            -Recurse `
            -Force
        }

        Set-Location deploy

        git init

        git checkout -b gh-pages

        git add .

        git commit `
          -m "Deploy reports"

        git push `
          https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git `
          gh-pages `
          --force

    # Webex
    - name: Send Webex Notification
      if: always()
      run: node sendWebex.js
      env:
        WEBEX_TOKEN: ${{ secrets.WEBEX_TOKEN }}
        WEBEX_ROOM_ID: ${{ secrets.WEBEX_ROOM_ID }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}